{% set name = "silvimetric" %}
{% set version = "2.0.1" %}
{% set sha256 = "d5533138ef32efed0deedc133622dcf0127b7a1f208cb31729091e51f4d17d39" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/silvimetric-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python
  number: 1
  entry_points:
    - silvimetric = silvimetric.cli.cli:cli

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - click
    - dask
    - pyproj
    - gdal
    - python-pdal
    - pandas
    - tiledb-py
    - scipy
    - dill
    - typing_extensions
    - lmoments3

test:
  requires:
    - python {{ python_min }}
  commands:
    - python -c "import silvimetric"
    - silvimetric --help

about:
  home: https://pdal.io
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Point Data Abstraction Library (PDAL) Python Package
  description: |
    Python package for extracting LiDAR forestry metrics
  doc_url: https://silvimetric.com
  dev_url: https://github.com/hobuinc/silvimetric

extra:
  recipe-maintainers:
    - hobu
